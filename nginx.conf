# Load balancer: round-robin across the two API instances on port 9999.
# It does no business logic — it only forwards traffic (per the architecture
# rules: no payload inspection, no conditionals, no early responses).

worker_processes 1;

events {
  worker_connections 1024;
}

http {
  access_log off;
  error_log /dev/stderr error;

  upstream api {
    server api1:9999;
    server api2:9999;
    keepalive 64;
  }

  server {
    listen 9999;

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
  }
}
