# SUBMISSION compose — goes at the ROOT of the `submission` branch.
# Image-based (no build context): the grader pulls a public image from Docker
# Hub. Replace renan04lima/rinha-back-2026 below if you push under another name.
#
# Budget: 1 CPU and 350 MB total across all services.
#   nginx 0.15 CPU / 32 MB  +  api1 0.425 / 159 MB  +  api2 0.425 / 159 MB
#   = 1.0 CPU / 350 MB

x-api: &api
  image: renan04lima/rinha-back-2026:latest
  platform: linux/amd64
  environment:
    NODE_OPTIONS: "--max-old-space-size=128"
  expose:
    - "9999"
  deploy:
    resources:
      limits:
        cpus: "0.425"
        memory: "159MB"
  networks:
    - rinha

services:
  api1:
    <<: *api

  api2:
    <<: *api

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api1
      - api2
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "32MB"
    networks:
      - rinha

networks:
  rinha:
    driver: bridge
