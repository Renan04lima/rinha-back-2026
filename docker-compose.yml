# LOCAL / build-based compose — for testing and for building the image you will
# push to Docker Hub. The submission branch uses an image-based compose instead
# (see submission/docker-compose.yml), since that branch must not carry source.
#
# Budget: 1 CPU and 350 MB total across all services.
#   nginx 0.15 CPU / 32 MB  +  api1 0.425 / 159 MB  +  api2 0.425 / 159 MB
#   = 1.0 CPU / 350 MB

x-api: &api
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    NODE_OPTIONS: "--max-old-space-size=128"
  platform: linux/amd64
  expose:
    - "9999"
  deploy:
    resources:
      limits:
        cpus: "0.425"
        memory: "159MB"
  networks:
    - rinha

services:
  api1:
    <<: *api

  api2:
    <<: *api

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api1
      - api2
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "32MB"
    networks:
      - rinha

networks:
  rinha:
    driver: bridge
